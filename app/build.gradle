apply plugin: 'com.android.application'

// the API key lives in local.properties, which git already ignores, so it never lands in a commit.
// it DOES land in the APK - anyone with the file can pull it out. that's acceptable for a demo we
// hand to nobody and unacceptable for anything shipped; the real fix is a server we don't have time
// to build. listed as a known shortcut in docs/DEMO.md
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace "com.google.ar.core.examples.java.helloar"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.google.ar.core.examples.java.helloar"

        // AR Optional apps must declare minSdkVersion >= 14.
        // AR Required apps must declare minSdkVersion >= 24.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName '1.0'
        buildConfigField "String", "OPENAI_API_KEY",
                "\"" + (localProps.getProperty("openaiApiKey") ?: "") + "\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    androidResources {
        // a 99MB model has to stay uncompressed so LiteRT can memory-map it straight out of the
        // apk. compressed, it would be unpacked to disk on every cold start
        noCompress += 'tflite'
        noCompress += 'task'
    }
    packaging {
        resources {
            // the SDK and its transitive deps each ship their own copies of these
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ARCore (Google Play Services for AR) library.
    implementation 'com.google.ar:core:1.54.0'

    // the scene description is a single HTTP POST written by hand rather than a vendor SDK. those
    // SDKs are built for servers - they drag in desugaring, duplicate META-INF entries and a few MB
    // of dex for one request. sixty lines of HttpURLConnection has nothing to go wrong on Android

    // Depth Anything V2, Qualcomm's TFLite build, for depth where ARCore has none. LiteRT split
    // into two lines: the 2.x artifact is the Kotlin-only CompiledModel API, and the Java
    // Interpreter path we need is the 1.x line
    implementation 'com.google.ai.edge.litert:litert:1.4.2'

    // MediaPipe runs both our vision models: the hand landmarker that watches for the shutter
    // gesture, and an object detector we filter down to COCO's person class. we feed them ARCore's
    // CPU camera image rather than opening a second camera - two things can't hold the camera at
    // once on Android. 1.0.0 moved the native library from tasks-vision into tasks-core, so the
    // artifact sizes look alarming and nothing about the build changes
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'

    // Obj - a simple Wavefront OBJ file loader
    // https://github.com/javagl/Obj
    implementation 'de.javagl:obj:0.4.0'

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
}
